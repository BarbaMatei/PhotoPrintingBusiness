title = "PhotoPrint gitleaks config (bolt 041)"

# Start from gitleaks' built-in rule set, then add project allowlists.
[extend]
useDefault = true

[allowlist]
description = "Legitimate occurrences of secret-shaped strings (test fixtures + docs)"
# Paths are regexes matched against the file path.
# Keep this set in sync with the allowlist in hooks/pre-commit.
paths = [
  '''src/PhotoPrint\.Tests/Helpers/TestKeys\.cs''',  # intentional RSA test fixture
  '''docs/.*''',                                       # analysis docs quote the PEM marker
  '''memory-bank/.*''',                                # specs/ADRs reference the marker
  '''README\.md''',                                    # documents the PEM setup format
  '''hooks/.*''',                                      # the guard contains the detection pattern
  '''\.gitleaks\.toml''',                              # this file
]

# The compose placeholders below are needed because an empty key makes the Stripe client throw where it is constructed.
regexes = [
  '''sk_test_e2e_placeholder''',
  '''sk_test_placeholder''',
  '''whsec_placeholder''',
]
