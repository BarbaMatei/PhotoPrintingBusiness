# ──────────────────────────────────────────────────────────────────────────────
#  Production stack: Caddy (auto-TLS edge) -> API.  See docs/DEPLOYMENT.md.
#  Postgres points at a MANAGED instance by default (ConnectionStrings__Default
#  in .env). Uncomment the `db` service for an all-in-one single-VM deploy.
#  Run on the host:  docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────
name: fototipar

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # persisted ACME certs — survives restarts
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. fototipar.ro}
    networks:
      default:
        # Fixed so ForwardedHeaders__TrustedProxies can name this proxy and nothing else.
        # Trusting the whole subnet instead would let any container here forge a client IP.
        ipv4_address: 172.28.0.2

  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/fototipar/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080;http://+:9090
      # /metrics is served on 9090 only. Caddy proxies 8080 and refuses /metrics,
      # so the scrape path has no route from the internet. See DEPLOYMENT.md §14.
      Observability__Metrics__ScrapePort: "9090"
    expose:
      - "8080"            # internal only — NOT published to the host
      - "9090"            # Prometheus scrape — internal only, never proxied
    volumes:
      - apidata:/app/Storage

  # ── All-in-one VM without a managed DB? Uncomment, and point
  #    ConnectionStrings__Default at Host=db.  ────────────────────────────────
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-fototipar}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  #     POSTGRES_DB: ${POSTGRES_DB:-fototipar}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  apidata:
  # pgdata:

# Declared so the proxy's address is knowable; Docker would otherwise pick the range at `up`
# time. If the host already routes 172.28.0.0/24, change it here and in .env — DEPLOYMENT.md §16.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
