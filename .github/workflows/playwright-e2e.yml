name: e2e

# The three real-money smoke paths (bolt 066): guest checkout, admin login, admin real-time
# order updates. Runs beside ci.yml, which keeps the unit suites and the bundle-size budget.
# A run costs several minutes, most of it building the API image, so documentation-only pushes
# skip it. Keep this list narrow: anything that can change behaviour must still trigger a run.
on:
  pull_request:
    paths-ignore: &docs
      - 'memory-bank/**'
      - 'reviews/**'
      - 'docs/**'
      - 'thesis/**'
      - '**/*.md'
  push:
    branches-ignore:
      - main
    paths-ignore: *docs

jobs:
  playwright:
    name: E2E — Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.e2e.yml -p fototipar-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/PhotoPrint.UI/package-lock.json

      # .env is gitignored, so a fresh checkout has none and compose refuses to start. The JWT key
      # is generated per run and read from the (gitignored) file by every compose step: putting a
      # multi-line PEM in $GITHUB_ENV would print it in each later step's env block.
      - name: Prepare stack configuration
        run: |
          cp .env.example .env
          sh scripts/gen-dev-keys.sh

      - name: Boot API + PostgreSQL
        run: |
          export E2E_JWT_PRIVATE_KEY_PEM="$(cat secrets/dev-jwt-private.pem)"
          docker compose $COMPOSE_FILES up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5052/health > /dev/null; then
              echo "API is healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in 120s. Logs:"
          export E2E_JWT_PRIVATE_KEY_PEM="$(cat secrets/dev-jwt-private.pem)"
          docker compose $COMPOSE_FILES logs api
          exit 1

      - name: Seed catalog, admin user and demo orders
        run: |
          export E2E_JWT_PRIVATE_KEY_PEM="$(cat secrets/dev-jwt-private.pem)"
          docker compose $COMPOSE_FILES run --rm api --seed-dev

      - name: Install UI dependencies
        working-directory: src/PhotoPrint.UI
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/PhotoPrint.UI
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        working-directory: src/PhotoPrint.UI
        run: npx playwright test

      - name: Collect API logs on failure
        if: failure()
        run: |
          export E2E_JWT_PRIVATE_KEY_PEM="$(cat secrets/dev-jwt-private.pem 2>/dev/null || echo unused)"
          docker compose $COMPOSE_FILES logs --no-color api > api-e2e.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            src/PhotoPrint.UI/playwright-report/
            src/PhotoPrint.UI/test-results/
            api-e2e.log
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: |
          export E2E_JWT_PRIVATE_KEY_PEM="$(cat secrets/dev-jwt-private.pem 2>/dev/null || echo unused)"
          docker compose $COMPOSE_FILES down -v
