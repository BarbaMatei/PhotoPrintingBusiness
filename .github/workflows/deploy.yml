name: deploy

# Chains off a green CI run on main, then builds + pushes the image to GHCR and
# deploys. The SSH deploy step self-skips until DEPLOY_HOST is configured, so the
# image build/push works even before a server exists. See docs/DEPLOYMENT.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fototipar/api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/fototipar/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fototipar
            export IMAGE_TAG=${{ steps.meta.outputs.sha }}
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af --filter "until=72h"

      - name: Deploy skipped (no server configured)
        if: ${{ env.DEPLOY_HOST == '' }}
        run: |
          echo "::notice::Image pushed as ghcr.io/${{ github.repository_owner }}/fototipar/api:${{ steps.meta.outputs.sha }}."
          echo "::notice::SSH deploy skipped — set DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY secrets to enable (see docs/DEPLOYMENT.md)."
