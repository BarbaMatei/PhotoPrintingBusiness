name: secret-scan

# Standalone secret-scanning workflow (bolt 041). Independent of the build/test
# CI pipeline (bolt 040) so it can run before that pipeline exists. When bolt 040
# lands, this may be folded into ci.yml or kept as a dedicated job.

on:
  push:
  pull_request:

# gitleaks-action lists the PR's commits via the GitHub API on pull_request events,
# which requires pull-requests: read. Without it the GITHUB_TOKEN returns
# 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan covers all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
